name: Pushup
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Pushup:
    type: application
    platform: iOS
    sources: [Pushup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pushup
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  PushupTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PushupTests]
    dependencies:
      - target: Pushup
schemes:
  Pushup:
    build:
      targets:
        Pushup: all
    test:
      targets: [PushupTests]
